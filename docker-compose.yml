services:
  app:
    build: .
    restart: always
    environment:
      - DATABASE_URL=mysql://smt_user:${MYSQL_PASSWORD}@db:3306/social_media_tool
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      # Verifies the CRM client-portal SSO handoff token (auth.ts's
      # verifyPortalSsoToken()) -- was hardcoded in plaintext directly in
      # this file on the live server (found + fixed 2026-09-18); must be
      # sourced from .env like every other secret here, never committed
      # as a literal value.
      - PORTAL_SSO_SECRET=${PORTAL_SSO_SECRET}
      - NEXTAUTH_URL=https://socialmediadost.com
      - AUTH_TRUST_HOST=true
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN}
      - RUNWAYML_API_SECRET=${RUNWAYML_API_SECRET}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      # Cross-app: CRM <-> SMDost (see .env.local.example for the full
      # explanation of each). Found missing from this file entirely
      # 2026-09-18, despite being genuinely required and present in the
      # live container via a server-side edit that was never committed
      # back here -- if this file were ever re-pulled onto the server
      # without that manual edit, every cross-app integration below
      # would silently go dead with no obvious error.
      - CRM_WEBHOOK_URL=${CRM_WEBHOOK_URL}
      - SMDOST_SERVICE_KEY=${SMDOST_SERVICE_KEY}
      - DRISHTI_API_URL=${DRISHTI_API_URL}
      - DRISHTI_SERVICE_KEY=${DRISHTI_SERVICE_KEY}
      # Meta Ads / Google Ads push integrations (see .env.local.example)
      - META_ADS_ACCESS_TOKEN=${META_ADS_ACCESS_TOKEN}
      - META_AD_ACCOUNT_ID=${META_AD_ACCOUNT_ID}
      - META_PAGE_ID=${META_PAGE_ID}
      - META_ADS_HOUSE_CLIENT_ID=${META_ADS_HOUSE_CLIENT_ID}
      - GOOGLE_ADS_CLIENT_ID=${GOOGLE_ADS_CLIENT_ID}
      - GOOGLE_ADS_CLIENT_SECRET=${GOOGLE_ADS_CLIENT_SECRET}
      - GOOGLE_ADS_REFRESH_TOKEN=${GOOGLE_ADS_REFRESH_TOKEN}
      - GOOGLE_ADS_DEVELOPER_TOKEN=${GOOGLE_ADS_DEVELOPER_TOKEN}
      - GOOGLE_ADS_LOGIN_CUSTOMER_ID=${GOOGLE_ADS_LOGIN_CUSTOMER_ID}
      - GOOGLE_ADS_CUSTOMER_ID=${GOOGLE_ADS_CUSTOMER_ID}
      - GOOGLE_ADS_HOUSE_CLIENT_ID=${GOOGLE_ADS_HOUSE_CLIENT_ID}
      - GOOGLE_ADS_API_VERSION=${GOOGLE_ADS_API_VERSION}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - root_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.social-media-tool.rule=Host(`socialmediadost.com`) || Host(`www.socialmediadost.com`)"
      - "traefik.http.routers.social-media-tool.entrypoints=web,websecure"
      - "traefik.http.routers.social-media-tool.tls=true"
      - "traefik.http.routers.social-media-tool.tls.certresolver=myhttpchallenge"
      - "traefik.http.services.social-media-tool.loadbalancer.server.port=3000"
      - "traefik.docker.network=root_default"

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: social_media_tool
      MYSQL_USER: smt_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10
      interval: 5s

networks:
  internal:
    driver: bridge
  root_default:
    external: true

volumes:
  mysql_data:
